spring.application.name=AduAja
server.port=${PORT:8080}
spring.profiles.active=local

# ==========================================
# THYMELEAF
# ==========================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# ==========================================
# STATIC RESOURCES & FILE UPLOAD
# ==========================================
spring.web.resources.static-locations=classpath:/static/
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

# ==========================================
# SUPABASE STORAGE
# ==========================================
supabase.url=${SUPABASE_URL}
supabase.anon-key=${SUPABASE_ANON_KEY}
supabase.bucket=${SUPABASE_BUCKET}

# ==========================================
# MAIL (Gmail SMTP)
# ==========================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.from=${MAIL_FROM}

# ==========================================
# SECURITY
# ==========================================
spring.security.user.name=${SECURITY_USER_NAME}
spring.security.user.password=${SECURITY_USER_PASSWORD}

# ==========================================
# ==========================================
# DEV MODE (Aktifkan untuk testing/fitur developer)
# ==========================================
app.dev-mode=${DEV_MODE:false}

# SESSION CONFIGURATION (FIX: Logout otomatis)
# ==========================================
# 4 jam session timeout agar warga/admin tidak auto-logout
server.servlet.session.timeout=14400
server.servlet.session.cookie.max-age=14400
server.servlet.session.cookie.http-only=true
