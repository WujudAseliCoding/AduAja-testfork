<html
  lang="id"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/master}"
>
  <th:block layout:fragment="extraHead">
    <title>AduAja - Verifikasi OTP & Reset Password</title>
  </th:block>

  <div layout:fragment="content" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-blue-100 p-4">
    <div class="w-full max-w-md">
      <!-- Logo -->
      <div class="text-center mb-8">
        <div class="flex items-center justify-center gap-2 mb-3">
          <img th:src="@{/img/Adu Aja Logo.png}" alt="Logo AduAja" class="w-20 h-20 object-contain" />
          <h1 class="text-4xl font-extrabold text-blue-600 tracking-tight">AduAja</h1>
        </div>
      </div>

      <div class="bg-white rounded-2xl shadow-xl p-8">
        <div class="flex items-center gap-3 mb-6">
          <div class="w-10 h-10 bg-orange-100 rounded-full flex items-center justify-center">
            <i data-lucide="shield-check" class="w-5 h-5 text-orange-600"></i>
          </div>
          <div>
            <h2 class="text-xl font-bold text-gray-900">Reset Password</h2>
            <p class="text-sm text-gray-500">
              Kode OTP dikirim ke:
              <span class="font-semibold text-blue-700" th:text="${email}">email@email.com</span>
            </p>
          </div>
        </div>

        <!-- Info OTP -->
        <div class="bg-blue-50 border border-blue-200 rounded-lg p-3 mb-4">
          <p class="text-sm text-blue-800">
            <i data-lucide="info" class="w-4 h-4 inline mr-1"></i>
            Kode OTP berlaku selama <strong>10 menit</strong>. Periksa konsol server (development mode).
          </p>
        </div>

        <!-- Error/Success -->
        <div th:if="${error}" class="bg-red-50 border-l-4 border-red-500 p-3 mb-4 rounded-lg">
          <p class="text-red-700 text-sm" th:text="${error}"></p>
        </div>
        <div th:if="${success}" class="bg-green-50 border-l-4 border-green-500 p-3 mb-4 rounded-lg">
          <p class="text-green-700 text-sm" th:text="${success}"></p>
        </div>

        <form th:action="@{/petugas/forgot-password/verify}" method="post" class="space-y-4">
          <input type="hidden" name="email" th:value="${email}" />

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Kode OTP (6 digit)</label>
            <input
              type="text"
              name="otpCode"
              maxlength="6"
              pattern="\d{6}"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent text-center text-2xl font-mono tracking-widest"
              placeholder="000000"
              required
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Password Baru</label>
            <input
              type="password"
              name="newPassword"
              minlength="8"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              placeholder="Min. 8 karakter"
              required
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Konfirmasi Password Baru</label>
            <input
              type="password"
              name="confirmNewPassword"
              minlength="8"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              placeholder="Ulangi password baru"
              required
            />
          </div>

          <button
            type="submit"
            class="w-full bg-blue-600 text-white py-3 rounded-lg font-medium hover:bg-blue-700 transition-colors"
          >
            Reset Password
          </button>
        </form>

        <div class="mt-4 flex items-center justify-between text-sm">
          <a th:href="@{/petugas/forgot-password}" class="text-gray-500 hover:text-blue-600 hover:underline">
            ← Kirim ulang OTP
          </a>
          <a th:href="@{/petugas/login}" class="text-blue-600 hover:underline">
            Kembali ke Login
          </a>
        </div>
      </div>
    </div>
  </div>
</html>
