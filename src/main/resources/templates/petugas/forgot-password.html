<html
  lang="id"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/master}"
>
  <th:block layout:fragment="extraHead">
    <title>AduAja - Lupa Password</title>
  </th:block>

  <div layout:fragment="content" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-blue-100 p-4">
    <div class="w-full max-w-md">
      <!-- Logo -->
      <div class="text-center mb-8">
        <div class="flex items-center justify-center gap-2 mb-3">
          <img th:src="@{/img/Adu Aja Logo.png}" alt="Logo AduAja" class="w-20 h-20 object-contain" />
          <h1 class="text-4xl font-extrabold text-blue-600 tracking-tight">AduAja</h1>
        </div>
        <p class="text-gray-500 text-sm">Sistem Pengaduan Masyarakat</p>
      </div>

      <div class="bg-white rounded-2xl shadow-xl p-8">
        <div class="flex items-center gap-3 mb-6">
          <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center">
            <i data-lucide="key" class="w-5 h-5 text-blue-600"></i>
          </div>
          <div>
            <h2 class="text-xl font-bold text-gray-900">Lupa Password</h2>
            <p class="text-sm text-gray-500">Masukkan email untuk mendapatkan kode OTP</p>
          </div>
        </div>

        <!-- Error/Success -->
        <div th:if="${error}" class="bg-red-50 border-l-4 border-red-500 p-3 mb-4 rounded-lg">
          <p class="text-red-700 text-sm" th:text="${error}"></p>
        </div>
        <div th:if="${success}" class="bg-green-50 border-l-4 border-green-500 p-3 mb-4 rounded-lg">
          <p class="text-green-700 text-sm" th:text="${success}"></p>
        </div>

        <form th:action="@{/petugas/forgot-password}" method="post" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Email Terdaftar</label>
            <div class="relative">
              <i data-lucide="mail" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"></i>
              <input
                type="email"
                name="email"
                class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                placeholder="nama@email.com"
                required
              />
            </div>
          </div>
          <button
            type="submit"
            class="w-full bg-blue-600 text-white py-3 rounded-lg font-medium hover:bg-blue-700 transition-colors"
          >
            Kirim Kode OTP
          </button>
        </form>

        <div class="mt-4 text-center">
          <a th:href="@{/petugas/login}" class="text-sm text-blue-600 hover:underline">
            ← Kembali ke Login
          </a>
        </div>
      </div>
    </div>
  </div>
</html>
