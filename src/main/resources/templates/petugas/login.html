<html
  lang="id"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/master}"
>
  <th:block layout:fragment="extraHead">
    <title>AduAja - Login Petugas</title>
    <style>
      [x-cloak] {
        display: none !important;
      }
    </style>
  </th:block>

  <div
    layout:fragment="content"
    class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-blue-100 p-4"
    x-data="{ showPassword: false, loading: false }"
  >
    <div class="w-full max-w-md">
      <div class="text-center mb-8">
        <div class="flex items-center justify-center gap-2 mb-3">
          <img
            th:src="@{/img/Adu Aja Logo.png}"
            alt="Logo AduAja"
            class="w-24 h-24 object-contain"
          />
          <h2 class="text-4xl font-extrabold text-gray-900 tracking-tight">AduAja</h2>
        </div>
        <p class="text-gray-600">Portal Petugas Lapangan</p>
      </div>

      <div class="bg-white rounded-lg shadow-lg p-8">
        <h3 class="text-2xl font-semibold text-gray-900 mb-6">Login Petugas</h3>

        <div
          th:if="${error}"
          class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm mb-4"
          th:text="${error}"
        ></div>

        <form
          th:action="@{/petugas/login}"
          method="post"
          class="space-y-6"
          x-on:submit="loading = true"
        >
          <div>
            <label
              for="email"
              class="block text-sm font-medium text-gray-900 mb-2"
              >Email / Nomor HP</label
            >
            <input
              id="email"
              name="email"
              type="text"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              placeholder="Masukkan email atau nomor HP"
              autocomplete="off"
              required
            />
          </div>

          <div>
            <label
              for="password"
              class="block text-sm font-medium text-gray-900 mb-2"
              >Password</label
            >
            <div class="relative">
              <input
                id="password"
                name="password"
                x-bind:type="showPassword ? 'text' : 'password'"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent pr-12"
                placeholder="Masukkan password"
                autocomplete="new-password"
                required
              />
              <button
                type="button"
                x-on:click="showPassword = !showPassword"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700"
              >
                <svg
                  x-show="!showPassword"
                  class="w-5 h-5"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                  />
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                  />
                </svg>
                <svg
                  x-show="showPassword"
                  class="w-5 h-5"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"
                  />
                </svg>
              </button>
            </div>
          </div>

          <button
            type="submit"
            class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition-colors"
            x-text="loading ? 'Memproses...' : 'Login'"
          ></button>

          <div class="text-center">
            <a
              th:href="@{/petugas/forgot-password}"
              class="text-sm text-blue-600 hover:text-blue-700 hover:underline"
            >
              Lupa Password?
            </a>
          </div>
        </form>
      </div>

      <div class="text-center mt-6 text-sm text-gray-600">
        <p>Sistem Informasi Pengaduan Masyarakat</p>
        <p class="mt-1">(c) 2026 AduAja - Kelompok PLR</p>
      </div>
    </div>
  </div>
</html>
