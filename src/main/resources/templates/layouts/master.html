<!doctype html>
<html
  lang="id"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${pageTitle} ?: 'AduAja'">AduAja</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
    <style>
      [x-cloak] {
        display: none !important;
      }
      /* FIX SCN-01/02/03: Global Flash Toast Notifications */
      .flash-toast-container {
        position: fixed;
        top: 1.25rem;
        right: 1.25rem;
        z-index: 99999;
        max-width: 26rem;
        width: calc(100% - 2.5rem);
      }
      @keyframes flashSlideIn {
        from { opacity: 0; transform: translateX(110%); }
        to { opacity: 1; transform: translateX(0); }
      }
      @keyframes flashFadeOut {
        from { opacity: 1; transform: translateX(0); }
        to { opacity: 0; transform: translateX(110%); }
      }
      .flash-toast-item {
        animation: flashSlideIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        margin-bottom: 0.5rem;
      }
      .flash-toast-item.hiding {
        animation: flashFadeOut 0.4s ease-in forwards;
      }
    </style>
    <th:block layout:fragment="extraHead"></th:block>
  </head>
  <body>
    <!-- FIX SCN-01/02/03: Global flash message toasts - tampil di semua halaman setelah redirect -->
    <div id="flashToastContainer" class="flash-toast-container">
      <div th:if="${success != null}" class="flash-toast-item flex items-center gap-3 bg-green-50 border border-green-300 text-green-900 px-4 py-3.5 rounded-xl shadow-lg">
        <div class="w-9 h-9 bg-green-100 rounded-lg flex items-center justify-center flex-shrink-0">
          <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
        </div>
        <div class="flex-1">
          <p class="text-sm font-semibold text-green-800" th:text="${success}">Berhasil!</p>
        </div>
        <button onclick="this.closest('.flash-toast-item').classList.add('hiding')" class="text-green-400 hover:text-green-600 ml-1 flex-shrink-0">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
      <div th:if="${error != null}" class="flash-toast-item flex items-center gap-3 bg-red-50 border border-red-300 text-red-900 px-4 py-3.5 rounded-xl shadow-lg">
        <div class="w-9 h-9 bg-red-100 rounded-lg flex items-center justify-center flex-shrink-0">
          <svg class="w-5 h-5 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
        </div>
        <div class="flex-1">
          <p class="text-sm font-semibold text-red-800" th:text="${error}">Gagal!</p>
        </div>
        <button onclick="this.closest('.flash-toast-item').classList.add('hiding')" class="text-red-400 hover:text-red-600 ml-1 flex-shrink-0">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
      <div th:if="${warning != null}" class="flash-toast-item flex items-center gap-3 bg-amber-50 border border-amber-300 text-amber-900 px-4 py-3.5 rounded-xl shadow-lg">
        <div class="w-9 h-9 bg-amber-100 rounded-lg flex items-center justify-center flex-shrink-0">
          <svg class="w-5 h-5 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
          </svg>
        </div>
        <div class="flex-1">
          <p class="text-sm font-semibold text-amber-800" th:text="${warning}">Peringatan!</p>
        </div>
        <button onclick="this.closest('.flash-toast-item').classList.add('hiding')" class="text-amber-400 hover:text-amber-600 ml-1 flex-shrink-0">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
    </div>
    <!-- Auto-hide toasts setelah 5 detik -->
    <script th:inline="javascript">
      (function() {
        var hasFlash = /*[[${success != null or error != null or warning != null}]]*/ false;
        if (hasFlash) {
          var items = document.querySelectorAll('.flash-toast-item');
          items.forEach(function(item) {
            setTimeout(function() {
              item.classList.add('hiding');
            }, 5000);
          });
        }
      })();
    </script>

    <main layout:fragment="content"></main>

    <!-- DEV MODE floating badge -->
    <div th:if="${devMode}" class="fixed bottom-4 left-4 z-50">
      <a th:href="@{/warga/dashboard}"
         class="flex items-center gap-2 px-3 py-2 bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold rounded-full shadow-lg transition-colors"
         title="Kembali ke Dashboard (Dev Mode)">
        <span class="w-2 h-2 bg-white rounded-full animate-pulse"></span>
        DEV
      </a>
    </div>

    <script src="/js/app.js"></script>
    <script>
      if (window.lucide) {
        lucide.createIcons();
      }
    </script>
    <th:block layout:fragment="extraScripts"></th:block>
  </body>
</html>
