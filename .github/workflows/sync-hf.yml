name: Sync to Hugging Face Hub

on:
  push:
    branches: [ main ] # Ganti 'master' jika branch utama Anda bernama master
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        # UBAH username-anda dan nama-space-anda DI BAWAH INI
        run: git push https://username-anda:${HF_TOKEN}@huggingface.co/spaces/username-anda/nama-space-anda main -f